<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

    <ui:define name="title">Neues Ticket - BVL Ticket System</ui:define>

    <ui:define name="content">
        <!-- Kopfzeile -->
        <div class="mb-8">
            <h:link outcome="tickets" class="nav-btn mb-4">
                <i class="pi pi-arrow-left"></i> Zurück zur Übersicht
            </h:link>
            <h1>Neues Ticket erstellen</h1>
            <p class="text-muted mt-2">Bitte füllen Sie alle markierten Felder aus, um eine Anfrage an Referat 404
                zu senden.</p>
        </div>

        <div class="max-w-900">
            <p:card>
                <h:form id="createForm" enctype="multipart/form-data">
                    <p:messages id="messages" showDetail="true" closable="true" />

                    <div class="ui-fluid p-4">
                        <!-- Hauptdaten Grid -->
                        <div class="detail-grid">
                            <div class="field">
                                <p:outputLabel for="function" value="Funktion / Modul *" styleClass="label-caps mb-2" />
                                <p:inputText id="function" value="#{createTicketBean.ticket.functionName}"
                                    required="true" placeholder="Name der betroffenen Funktion" />
                            </div>
                            <div class="field">
                                <p:outputLabel for="type" value="Ticket Typ *" styleClass="label-caps mb-2" />
                                <p:selectOneMenu id="type" value="#{createTicketBean.ticket.featureType}">
                                    <f:selectItems value="#{createTicketBean.getFeatureTypes()}" />
                                </p:selectOneMenu>
                            </div>
                        </div>

                        <!-- Beschreibung -->
                        <div class="field mt-4">
                            <p:outputLabel for="description" value="Problem beschreibung *"
                                styleClass="label-caps mb-2" />
                            <p:inputTextarea id="description" value="#{createTicketBean.ticket.description}"
                                required="true" rows="6"
                                placeholder="Bitte beschreiben Sie den Fehler oder die Anforderung so detailliert wie möglich..." />
                        </div>

                        <div class="detail-grid mt-4">
                            <div class="field">
                                <p:outputLabel for="db" value="Betroffene Datenbank *" styleClass="label-caps mb-2" />
                                <p:inputText id="db" value="#{createTicketBean.ticket.affectedDatabase}" required="true"
                                    placeholder="z.B. Vektoren, Onkogene, Zellinien-DB" />
                            </div>
                            <div class="field">
                                <p:outputLabel for="priority" value="Priorisierung *" styleClass="label-caps mb-2" />
                                <p:selectOneMenu id="priority" value="#{createTicketBean.ticket.priority}">
                                    <f:selectItems value="#{createTicketBean.getPriorities()}" />
                                </p:selectOneMenu>
                            </div>
                            <div class="field">
                                <p:outputLabel for="assignedTo" value="Zuweisen an" styleClass="label-caps mb-2" />
                                <p:selectOneMenu id="assignedTo" value="#{createTicketBean.assignedToUserId}"
                                    filter="true" filterMatchMode="contains">
                                    <f:selectItem itemLabel="-- Nicht zugewiesen --" itemValue="" />
                                    <f:selectItems value="#{createTicketBean.assignableUsers}" var="user"
                                        itemLabel="#{user.name} (#{user.email})" itemValue="#{user.id}" />
                                </p:selectOneMenu>
                            </div>
                        </div>

                        <!-- Anhang & Zeit -->
                        <div class="detail-grid mt-4">
                            <div class="field">
                                <!-- Bereich zum Auswählen eines Bildes (Auto-Upload) -->
                                <div class="flex-start gap-2 mb-2">
                                    <p:fileUpload listener="#{createTicketBean.onFileUpload}" mode="advanced"
                                        auto="true" update="screenshotPreview messages" label="Bild sofort hinzufügen"
                                        allowTypes="/(\.|\/)(gif|jpe?g|png)$/" sizeLimit="5000000" />
                                </div>
                                <h:panelGroup id="screenshotPreview" layout="block">
                                    <div class="flex-start gap-2 flex-wrap">
                                        <ui:repeat value="#{createTicketBean.ticket.screenshotUrls}" var="url">
                                            <div style="border: 1px solid #ddd; padding: 2px; border-radius: 4px;">
                                                <img src="#{url}" class="screenshot-preview-small" alt="Preview" />
                                            </div>
                                        </ui:repeat>
                                    </div>
                                </h:panelGroup>
                            </div>
                            <h:panelGroup rendered="#{loginBean.currentUser.role == 'ADMIN'}" layout="block"
                                class="field">
                                <p:outputLabel for="effort" value="Geschätzter Aufwand" styleClass="label-caps mb-2" />
                                <div class="flex-start gap-4">
                                    <p:inputNumber id="effort" value="#{createTicketBean.ticket.timeEffort}"
                                        placeholder="0.0" style="flex: 1" decimalPlaces="1" />
                                    <p:selectOneMenu value="#{createTicketBean.ticket.timeUnit}" style="width: 140px">
                                        <f:selectItems value="#{createTicketBean.getTimeUnits()}" var="u"
                                            itemLabel="#{u.label}" itemValue="#{u}" />
                                    </p:selectOneMenu>
                                </div>
                            </h:panelGroup>
                        </div>

                        <!-- Sichtbarkeit Schalter -->
                        <div class="flex-center mt-8">
                            <p:inputSwitch value="#{createTicketBean.ticket.public}" id="public" />
                            <p:outputLabel for="public" value="Öffentlich für alle Abteilungen sichtbar"
                                styleClass="label-caps" />
                        </div>

                        <!-- Buttons zum Speichern/Abbrechen -->
                        <div class="mt-8 pt-8 border-top flex-center">
                            <p:commandButton value="Ticket jetzt erstellen" action="#{createTicketBean.save}"
                                update="@form" icon="pi pi-check" styleClass="ui-button-primary" style="flex: 1" />
                            <p:button value="Abbrechen" outcome="tickets"
                                styleClass="ui-button-secondary ui-button-flat" style="flex: 1" />
                        </div>
                    </div>
                </h:form>
            </p:card>
        </div>
    </ui:define>

</ui:composition>
