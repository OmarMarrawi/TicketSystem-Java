<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

    <ui:define name="title">Benutzer-Verwaltung - IT-Ticket-System</ui:define>

    <ui:define name="content">
        <div class="mb-8">
            <h1>Benutzer-Verwaltung</h1>
            <p class="text-muted mt-2">Alle Benutzerkonten und Rollen im System</p>
        </div>

        <h:form id="usersForm">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
                <p:commandButton value="Neuer Benutzer" icon="pi pi-plus"
                    action="#{usersBean.prepareNew}" update=":userDialogContent"
                    oncomplete="PF('userDialog').show()" styleClass="ui-button-success rounded-8" />
            </div>

            <p:dataTable id="usersTable" value="#{usersBean.users}" var="user"
                paginator="true" rows="15" paginatorPosition="bottom"
                emptyMessage="Keine Benutzer gefunden" styleClass="ui-datatable-borderless">

                <f:facet name="header">
                    <div class="p-2" style="font-weight: 600;">
                        Benutzer (#{usersBean.users.size()})
                    </div>
                </f:facet>

                <p:column headerText="ID" sortBy="#{user.id}" style="width: 60px;">
                    <h:outputText value="#{user.id}" />
                </p:column>

                <p:column headerText="Name" sortBy="#{user.name}" filterBy="#{user.name}" filterMatchMode="contains">
                    <h:outputText value="#{user.name}" />
                </p:column>

                <p:column headerText="E-Mail" sortBy="#{user.email}" filterBy="#{user.email}" filterMatchMode="contains">
                    <h:outputText value="#{user.email}" />
                </p:column>

                <p:column headerText="Rolle" sortBy="#{user.role.label}" style="width: 170px;">
                    <h:outputText value="#{user.role.label}" />
                </p:column>

                <p:column headerText="Aktionen" style="width: 110px; text-align: center;">
                    <p:commandButton icon="pi pi-pencil" title="Bearbeiten" styleClass="ui-button-info rounded-button ui-button-flat mr-2"
                        action="#{usersBean.prepareEdit(user)}" update=":userDialogContent"
                        oncomplete="PF('userDialog').show()" />
                    <p:commandButton icon="pi pi-trash" title="Löschen" styleClass="ui-button-danger rounded-button ui-button-flat"
                        action="#{usersBean.deleteUser(user)}" update=":usersForm:usersTable :growl">
                        <p:confirm header="Benutzer löschen"
                            message="'#{user.email}' wirklich löschen?"
                            icon="pi pi-exclamation-triangle" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="Nein" type="button" styleClass="ui-confirmdialog-no" />
                <p:commandButton value="Ja, löschen" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
            </p:confirmDialog>
        </h:form>

        <!-- Dialog: Neuer / Bearbeiten -->
        <p:dialog widgetVar="userDialog" modal="true" resizable="false" width="440"
                  header="#{usersBean.editMode ? 'Benutzer bearbeiten' : 'Neuer Benutzer'}">
            <h:form id="userDialogContent">
                <p:messages id="userMsg" showDetail="true" closable="true" />

                <div class="field" style="margin-bottom: 1rem;">
                    <p:outputLabel for="userName" value="Name" styleClass="label-caps mb-1" />
                    <p:inputText id="userName" value="#{usersBean.selectedUser.name}" required="true"
                        label="Name" style="width: 100%;" placeholder="Vor- und Nachname" />
                </div>

                <div class="field" style="margin-bottom: 1rem;">
                    <p:outputLabel for="userEmail" value="E-Mail" styleClass="label-caps mb-1" />
                    <p:inputText id="userEmail" value="#{usersBean.selectedUser.email}" required="true"
                        label="E-Mail" style="width: 100%;" placeholder="name@bvl.bund.de" />
                </div>

                <div class="field" style="margin-bottom: 1rem;">
                    <p:outputLabel for="userRole" value="Rolle" styleClass="label-caps mb-1" />
                    <p:selectOneMenu id="userRole" value="#{usersBean.selectedUser.role}" required="true"
                        label="Rolle" style="width: 100%;">
                        <f:selectItem itemLabel="-- Rolle auswählen --" itemValue="#{null}"
                            noSelectionOption="true" />
                        <f:selectItems value="#{usersBean.roles}" var="role" itemLabel="#{role.label}"
                            itemValue="#{role}" />
                    </p:selectOneMenu>
                </div>

                <div class="field" style="margin-bottom: 1.25rem;">
                    <p:outputLabel for="userPassword" value="Passwort #{usersBean.editMode ? '(leer = unverändert)' : ''}"
                        styleClass="label-caps mb-1" />
                    <p:password id="userPassword" value="#{usersBean.newPassword}" toggleMask="true"
                        style="width: 100%;" placeholder="#{usersBean.editMode ? 'Nur eingeben zum Zurücksetzen' : 'Start-Passwort'}"
                        feedback="#{not usersBean.editMode}" />
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <p:commandButton value="Abbrechen" type="button"
                        onclick="PF('userDialog').hide()" styleClass="ui-button-secondary" />
                    <p:commandButton value="Speichern" icon="pi pi-check"
                        action="#{usersBean.save}" update=":usersForm:usersTable :userDialogContent :growl"
                        styleClass="ui-button-primary" />
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
