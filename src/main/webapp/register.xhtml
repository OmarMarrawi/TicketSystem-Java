<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Registrierung - IT-Ticket-System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <h:outputStylesheet library="css" name="style.css" />
</h:head>

<h:body styleClass="login-body">
    <div class="login-card">
        <!-- Kopfbereich der Registrierung -->
        <div class="login-header">
            <div class="logo-box login-logo">
                <i class="pi pi-ticket"></i>
            </div>
            <h1>BVL-Ticket-System</h1>
            <p class="text-muted mt-2">Registrieren Sie sich, um ein neues Konto zu erstellen</p>
        </div>

        <h:form id="registerForm">
            <p:messages id="messages" showDetail="true" closable="true">
                <p:autoUpdate />
            </p:messages>

            <div class="ui-fluid">
                <!-- E-Mail Feld -->
                <div class="field mb-4">
                    <p:outputLabel for="email" value="E-Mail" styleClass="label-caps mb-2" />
                    <p:inputText id="email" value="#{registerBean.email}" required="true" placeholder="name@bvl.bund.de" />
                </div>

                <!-- Name Feld -->
                <div class="field mb-4">
                    <p:outputLabel for="name" value="Name" styleClass="label-caps mb-2" />
                    <p:inputText id="name" value="#{registerBean.name}" required="true" placeholder="Ihr Name" />
                </div>

                <!-- Passwort Feld -->
                <div class="field mb-4">
                    <p:outputLabel for="password" value="Passwort" styleClass="label-caps mb-2" />
                    <p:password id="password" value="#{registerBean.password}" required="true" toggleMask="true"
                        redisplay="true" />
                </div>

                <!-- Passwort bestätigen Feld -->
                <div class="field mb-4">
                    <p:outputLabel for="confirmPassword" value="Passwort bestätigen" styleClass="label-caps mb-2" />
                    <p:password id="confirmPassword" value="#{registerBean.confirmPassword}" required="true" toggleMask="true"
                        redisplay="true" />
                </div>

                <!-- Rollenauswahl Feld -->
                <div class="field mb-8">
                    <p:outputLabel for="role" value="Rolle auswählen" styleClass="label-caps mb-2" />
                    <p:selectOneMenu id="role" value="#{registerBean.selectedRole}" required="true" converter="omnifaces.SelectItemsConverter">
                        <f:selectItems value="#{registerBean.availableRoles}" var="role"
                                       itemLabel="#{role.label}" itemValue="#{role}" />
                    </p:selectOneMenu>
                </div>

                <!-- Registrieren Button -->
                <p:commandButton value="Registrieren" action="#{registerBean.register}" update="@form"
                    styleClass="ui-button-primary rounded-8" style="padding: 0.75rem; font-size: 1rem" />

                <div class="text-muted text-tiny" style="text-align: center; margin-top: 2.5rem;">
                    Bereits registriert? <p:link outcome="login" value="Hier anmelden" />
                </div>
            </div>
        </h:form>
    </div>
</h:body>

</html>
